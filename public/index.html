<html lang="en">
<head>

<title>Orry Baram</title>
<meta name="description" content="Hello, my name is Orry Baram. Here for the pizza. Philadelphia, PA.">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700&family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500&family=Permanent+Marker&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  /* Layout: one full-bleed fabric canvas, the sticker on the "chest", a quiet row of links under it. Single look by choice. */
  :root {
    --fleece: #303033;
    --thread: #e8e7e3;
    --thread-soft: #a3a3a8;
    --sticker-red: #d42a20;
    --sticker-paper: #fbfbf8;
    --ink: #17171d;
    --font-print: "Archivo Black", "Arial Black", Impact, sans-serif;
    --font-print-sub: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --font-ink: "Permanent Marker", "Marker Felt", "Comic Sans MS", cursive;
    --font-util: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--fleece);
    color: var(--thread);
    overflow: hidden;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    font-family: var(--font-util);
  }
  #stage {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    display: block;
    touch-action: none;
  }

  /* The sticker as real HTML. Inside <canvas layoutsubtree> it is laid out but not painted;
     the WebGL shader paints it onto the fabric. */
  .sticker {
    width: 420px; height: 300px;
    box-sizing: border-box;
    position: relative;
    border-radius: 22px;
    background: var(--sticker-red);
    color: #fff;
    text-align: center;
  }
  .sticker .hello {
    position: absolute; left: 0; right: 0; top: 14px;
    font: 400 62px/1 var(--font-print);
    letter-spacing: 4px;
  }
  .sticker .mni {
    position: absolute; left: 0; right: 0; top: 80px;
    font: 700 21px/1 var(--font-print-sub);
    letter-spacing: 0.5px;
  }
  .sticker .write {
    position: absolute; left: 14px; right: 14px; top: 114px; bottom: 42px;
    background: var(--sticker-paper);
    border-radius: 4px;
  }
  .sticker .name {
    position: absolute; left: 0; right: 0; top: 28px; margin: 0;
    display: flex; justify-content: center;
    transform: rotate(-2deg);
  }
  .sticker .name img { display: block; width: 340px; height: auto; }
  /* The handwriting is an image; this invisible text over it makes the name selectable and findable. */
  .sticker .name-text {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font: 400 48px/1 var(--font-ink);
    color: transparent;
  }
  .sticker .name-text::selection { color: transparent; background: rgba(60, 120, 230, .35); }
  .sticker .sub {
    position: absolute; left: 0; right: 0; bottom: 12px; margin: 0;
    font: 400 17px/1 var(--font-ink);
    color: #25252c;
    transform: rotate(-1.5deg);
  }

  /* The text layer: an invisible copy of the sticker and links, laid over the canvas exactly where
     the shader draws them (transform set in JS). It's ordinary DOM, so text selection,
     find-in-page, clicks and keyboard focus work in every browser, not only ones with HTML-in-Canvas. */
  #textlayer {
    position: fixed; inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  #textlayer > * {
    position: absolute; left: 0; top: 0;
    transform-origin: 0 0;
    pointer-events: auto;
  }
  #textlayer .sticker, #textlayer .write { background: transparent; }
  #textlayer * { color: transparent !important; }
  #textlayer img { visibility: hidden; }
  #textlayer ::selection { color: transparent; background: rgba(60, 120, 230, .35); }
  #textlayer a:focus { outline: none; }          /* focus shows as coloured thread in the stitching */

  /* No-WebGL fallback: show the plain HTML sticker */
  #hairs {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    pointer-events: none;      /* the sticker underneath still gets its drags */
  }
  #plain { display: none; }
  .nogl #stage { display: none; }
  .nogl #plain {
    display: grid; place-items: center; height: 100%;
  }
  .nogl #plain .sticker { transform: rotate(-3.5deg); box-shadow: 0 1px 2px rgba(0,0,0,.25); }

  /* The links live inside the canvas too. Laid out at a fixed size; the shader stitches
     them into the shirt from this element's rendering (white text = where the thread goes). */
  .links {
    width: 132px; height: 52px;
    display: flex;
  }
  .links a {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    color: #fff; text-decoration: none;
  }
  .links svg { width: 37px; height: 37px; fill: currentColor; display: block; }
  .nogl #plain { flex-direction: column; gap: 28px; display: flex; align-items: center; justify-content: center; }
  .nogl .links a { color: var(--thread); }
  .nogl .links a:focus-visible { outline: 2px solid var(--thread); outline-offset: 2px; }

  #badge {
    position: fixed; z-index: 2;
    left: calc(12px + env(safe-area-inset-left, 0px));
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    max-width: min(560px, calc(100vw - 24px));
    font: 400 11px/1.45 var(--font-util);
    color: var(--thread-soft);
    background: rgba(0,0,0,.35);
    padding: 6px 9px; border-radius: 3px;
  }
  #badge b { font-weight: 500; color: var(--thread); }
</style>
</head>

    float foldH(vec2 p){

    vec3 heather(vec2 p){

      float a = snoise(p * vec2(0.35, 0.09));
      float b = snoise(p * vec2(0.12, 0.45) + 11.0);

    float lintDots(vec2 q, float cell, float chance, float r0, float r1, float seed){

    // A speech bubble saying "Hi", scribbled in ballpoint on the backing. s is in the drawing's own
    // frame (px at a 420px-wide sticker): x right, y down, bubble centred on 0. Returns ink coverage.
    float sdSeg(vec2 p, vec2 a, vec2 b){
      vec2 pa = p - a, ba = b - a;
      return length(pa - ba * clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0));
    }
    vec2 bubblePt(float th){
      float wob = 1.0 + 0.05 * sin(3.0 * th + 1.0) + 0.03 * sin(5.0 * th + 2.0);
      return vec2(cos(th) * 33.0, sin(th) * 25.0) * wob + vec2(th * 0.5 - 1.5, 0.0);   // drifts, so the ends don't meet neatly
    }
    float penBubble(vec2 s){
      float d = 1e5;
      vec2 prev = bubblePt(-0.5);
      for (int i = 1; i <= 40; i++) {                      // the bubble: one loop that overshoots its start
        vec2 cur = bubblePt(-0.5 + float(i) / 40.0 * 6.9);
        d = min(d, sdSeg(s, prev, cur));
        prev = cur;
      }
      d = min(d, sdSeg(s, vec2(17.0, 19.0), vec2(19.0, 38.0)));          // tail: a stroke down...
      d = min(d, sdSeg(s, vec2(6.0, 26.0), vec2(20.0, 30.0)));           // ...and one flicked out across it
      d = min(d, sdSeg(s, vec2(20.0, 30.0), vec2(34.0, 37.0)));
      d = min(d, sdSeg(s, vec2(-15.0, -11.0), vec2(-12.0, 12.0)));       // H
      d = min(d, sdSeg(s, vec2(-1.0, -13.0), vec2(1.0, 9.0)));
      d = min(d, sdSeg(s, vec2(-17.0, 2.0), vec2(1.0, -1.0)));
      d = min(d, sdSeg(s, vec2(9.0, -1.0), vec2(12.0, 12.0)));           // i
      d = min(d, length(s - vec2(7.5, -9.5)) - 1.2);                     // its dot
      float r = 1.5 + 0.35 * snoise(s * 0.08);                             // ballpoint pressure varies a little
      return smoothstep(r + 0.7, r - 0.3, d);
    }

    // One cat hair stuck to the backing: a gently bowed strand from A to B (uv on the sticker),
    // fine and fading at both ends. Returns coverage.
    float catHair(vec2 q, vec2 a, vec2 b, float bend){
      vec2 A = a * uSize, B = b * uSize;
      vec2 ab = B - A;
      vec2 nrm = normalize(vec2(-ab.y, ab.x));
      float len = length(ab);
      float best = 1e5, bt = 0.0;
      vec2 prev = A;
      for (int i = 1; i <= 10; i++) {
        float t = float(i) / 10.0;
        vec2 cur = A + ab * t + nrm * len * (bend * sin(t * 3.14159) + bend * 0.25 * sin(t * 6.2832));
        vec2 ba = cur - prev, pa = q - prev;
        float hh = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
        float d = length(pa - ba * hh);
        if (d < best) { best = d; bt = t - 0.1 + hh * 0.1; }
        prev = cur;
      }
      float taper = smoothstep(0.0, 0.12, bt) * smoothstep(1.0, 0.7, bt);
      return smoothstep(0.75, 0.1, best + (1.0 - taper) * 0.5) * taper;
    }
    float catHairs(vec2 q){
      float c = 0.0;
      c = max(c, catHair(q, vec2(0.78, 0.07), vec2(0.95, 0.31), 0.05));
      c = max(c, catHair(q, vec2(0.60, 0.16), vec2(0.87, 0.11), -0.04));
      c = max(c, catHair(q, vec2(0.88, 0.40), vec2(0.97, 0.63), 0.04));
      c = max(c, catHair(q, vec2(0.69, 0.29), vec2(0.81, 0.50), -0.06));
      c = max(c, catHair(q, vec2(0.10, 0.80), vec2(0.31, 0.93), 0.05));
      c = max(c, catHair(q, vec2(0.04, 0.16), vec2(0.21, 0.05), -0.05));
      c = max(c, catHair(q, vec2(0.80, 0.86), vec2(0.96, 0.74), 0.04));
      return c;
    }

    void main(){
      vec2 p = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y) / uDpr;

      // fold normal
      float e = 1.5;
      float h = foldH(p);
      vec2 g = vec2(foldH(p + vec2(e, 0.0)) - foldH(p - vec2(e, 0.0)),
                    foldH(p + vec2(0.0, e)) - foldH(p - vec2(0.0, e))) / (2.0 * e);
      float k = uScale * 0.12;
      vec3 nF = normalize(vec3(-g * k, 1.0));

      // knit normal (fabric texture follows the folds a little)
      vec2 pk = p + g * uScale * 1.2;
      float kn = knit(pk);
      vec2 kg = vec2(knit(pk + vec2(0.6, 0.0)) - kn, knit(pk + vec2(0.0, 0.6)) - kn) / 0.6;

      // side seam
      float stitch, m1;
      float sh0 = seams(pk, stitch);
      vec2 sg = vec2(seams(pk + vec2(0.7, 0.0), m1) - sh0,
                     seams(pk + vec2(0.0, 0.7), m1) - sh0) / 0.7;

      vec3 L = normalize(vec3(uLight, 0.85));
      vec3 N = normalize(nF + vec3(-kg * 0.6, 0.0) + vec3(-sg * 0.45, 0.0));
      float diff = max(dot(N, L), 0.0);
      float ao = mix(0.86, 1.0, smoothstep(-1.1, 1.0, h)) * clamp(1.0 + sh0 * 0.05, 0.86, 1.05);
      vec3 fab = heather(pk) * (0.58 + 0.62 * diff) * ao * mix(0.80, 1.0, kn);
      fab += 0.05 * pow(1.0 - max(N.z, 0.0), 1.5);   // fleece fuzz sheen on fold edges
      fab = mix(fab, vec3(0.26) * (0.55 + 0.6 * diff), clamp(stitch, 0.0, 1.0) * 0.75);

      // ---- easter egg: Orry's ghost doodle, satin-stitched into the shirt under the sticker
      {
        float ec = cos(uEmbAngle), es = sin(uEmbAngle);
        mat2 ER = mat2(ec, -es, es, ec);       // screen -> local
        mat2 ERi = mat2(ec, es, -es, ec);      // local -> screen
        vec2 lp = ER * (pk - uEmbCenter);      // local px from the centre
        vec2 el = lp / uEmbSize + 0.5;
        if (el.x > -0.05 && el.x < 1.05 && el.y > -0.05 && el.y < 1.2) {
          float inb = step(0.0, el.x) * step(el.x, 1.0) * step(0.0, el.y) * step(el.y, 1.0);
          vec2 ec01 = clamp(el, 0.0, 1.0);
          vec2 tx = 1.2 / uEmbSize;
          vec4 m = texture2D(uEmb, ec01);
          float sharp = m.r * inb, soft = m.g * inb;
          vec2 eg = vec2(texture2D(uEmb, ec01 + vec2(tx.x, 0.0)).g - texture2D(uEmb, ec01 - vec2(tx.x, 0.0)).g,
                         texture2D(uEmb, ec01 + vec2(0.0, tx.y)).g - texture2D(uEmb, ec01 - vec2(0.0, tx.y)).g) * inb / 2.4;
          eg = ERi * eg;

          // satin stitch, done the same way as the icons: each thread runs straight across the
          // stroke (taken from the edge's slope), laid side by side along it; where the slope is
          // too faint to tell, the stored stitch direction fills in
          vec2 o2 = texture2D(uEmbDir, ec01).rg * 2.0 - 1.0;
          float th = 0.5 * atan(o2.y, o2.x);
          vec2 stored = ERi * vec2(cos(th), sin(th));
          // the edge slope, measured wider (±3px on the blurred mask) so it turns smoothly round curves
          vec2 tw = 3.0 / uEmbSize;
          vec2 egw = vec2(texture2D(uEmb, ec01 + vec2(tw.x, 0.0)).g - texture2D(uEmb, ec01 - vec2(tw.x, 0.0)).g,
                          texture2D(uEmb, ec01 + vec2(0.0, tw.y)).g - texture2D(uEmb, ec01 - vec2(0.0, tw.y)).g);
          egw = ERi * egw;
          float egm = length(egw);
          vec2 across = normalize(mix(stored, egw / max(egm, 1e-4), smoothstep(0.08, 0.4, egm)));
          // how far inside a wide patch we are: average the mask in a ring ~5px out. Thin strokes
          // fall off inside that ring; wide areas (the hem's blobs) stay full and get a fill stitch
          vec2 tr = 5.0 / uEmbSize;
          float ring = 0.0;
          for (int i = 0; i < 8; i++) {
            float an = float(i) * 0.7854;
            ring += texture2D(uEmb, clamp(ec01 + vec2(cos(an), sin(an)) * tr, 0.0, 1.0)).r;
          }
          float interior = smoothstep(0.8, 0.97, ring / 8.0) * sharp;
          across = normalize(mix(across, normalize(vec2(0.6, 0.8)), interior));   // fill rows run at one fixed slant
          vec2 along = vec2(-across.y, across.x);
          // measured from the ghost's own centre: from far away, the slightest turn in direction
          // would shift the thread lines a lot and scramble them into grain
          float v = dot(pk - uEmbCenter, along);
          float tv = fract(v / (1.1 * uZoom));
          float ridge = sin(tv * 3.14159);                                  // symmetric, so no seam where the slope flips
          float wob = hash(vec2(floor(v / (1.1 * uZoom)), 5.0));           // thread-to-thread variation
          // fill stitch: short stitches in offset rows, like brickwork (same as the LinkedIn square)
          float erow = floor(v / (1.1 * uZoom));
          float eph = fract((dot(pk - uEmbCenter, across) + erow * 1.9 + hash(vec2(erow, 13.0)) * 1.3) / (4.5 * uZoom));
          float eends = smoothstep(0.0, 0.14, eph) * smoothstep(1.0, 0.86, eph);
          ridge *= mix(1.0, mix(0.55, 1.0, eends), interior);
          vec3 NE = normalize(N + vec3(-eg * 9.0, 0.0) + vec3(-along * cos(tv * 3.14159) * 0.6 * sharp, 0.0));
          float ed = max(dot(NE, L), 0.0);
          vec3 He = normalize(L + vec3(0.0, 0.0, 1.0));
          // satin shines more where its threads lie in line with the light
          float sheen = pow(max(dot(NE, He), 0.0), 18.0) * (0.18 + 0.4 * abs(dot(across, normalize(uLight))));
          vec3 thread = vec3(0.90, 0.895, 0.88) * (0.95 + 0.08 * wob);
          vec3 embC = thread * (0.5 + 0.8 * ed) * (0.58 + 0.42 * ridge) + sheen * ridge;   // same thread contrast as the icons
          fab *= 1.0 - 0.22 * clamp(soft - sharp * 0.8, 0.0, 1.0);   // fleece pulled in around it
          fab = mix(fab, embC, smoothstep(0.3, 0.7, sharp));

        }
      }

      // ---- the ghost's one loose hair: a thread come free at the top of its head, curling over
      // like a cowlick. A cubic curve whose control points JS animates with a spring (uHairA: P0,P1; uHairB: P2,P3).
      if (length(pk - uHairA.xy) < 70.0) {
        vec2 P0 = uHairA.xy, P1 = uHairA.zw, P2 = uHairB.xy, P3 = uHairB.zw;
        vec2 hs = pk + uLight * 3.0;                    // it stands off the cloth a little, so its shadow lands away
        float best = 1e5, bestS = 1e5, bt = 0.0;
        vec2 prev = P0;
        for (int i = 1; i <= 18; i++) {
          float t = float(i) / 18.0, u = 1.0 - t;
          vec2 cur = u*u*u*P0 + 3.0*u*u*t*P1 + 3.0*u*t*t*P2 + t*t*t*P3;
          vec2 ba = cur - prev, pa = pk - prev;
          float hh = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-4), 0.0, 1.0);
          float d = length(pa - ba * hh);
          if (d < best) { best = d; bt = t - 1.0 / 18.0 + hh / 18.0; }
          pa = hs - prev;
          bestS = min(bestS, length(pa - ba * clamp(dot(pa, ba) / max(dot(ba, ba), 1e-4), 0.0, 1.0)));
          prev = cur;
        }
        // a slightly fuzzy, matte strand of the same thread, thinning toward the free end and
        // growing out of the stitches at its root (it fades in over the first stretch)
        float fuzz = snoise(pk * 1.3) * 0.22 + sin(bt * 17.0 + 1.3) * 0.35 * smoothstep(0.2, 0.6, bt);
        float r = uZoom * mix(0.95, 0.55, smoothstep(0.35, 1.0, bt));
        float root = smoothstep(0.02, 0.2, bt);
        float cov = smoothstep(r + 0.5, r - 0.3, best + fuzz) * mix(0.55, 1.0, root);
        fab *= 1.0 - 0.18 * smoothstep(2.0, 0.2, bestS) * (1.0 - cov) * root;
        float tn = sqrt(max(1.0 - pow(clamp(best / r, 0.0, 1.0), 2.0), 0.0));
        float twist = 0.78 + 0.22 * sin(bt * 46.0 + best * 2.5);           // the ply twist of the thread
        float hd = max(dot(N, L), 0.0);
        vec3 hairC = vec3(0.90, 0.895, 0.88) * (0.5 + 0.8 * hd) * (0.62 + 0.38 * tn) * twist
                   + pow(tn, 10.0) * 0.05;                                 // only a faint sheen, like the stitches
        fab = mix(fab, hairC, cov);
      }

      // ---- the links, embroidered in the same thread. Their texture is the live HTML <nav>.
      // Hover: a sheen sweeps across the satin and, thread by thread, the stitches change to the
      // brand's colour; on the way out they change back the same way, in reverse.
      {
        vec2 ll = (pk - uLinkCenter) / uLinkSize + 0.5;
        if (ll.x > -0.15 && ll.x < 1.15 && ll.y > -0.45 && ll.y < 1.45) {
          float inb = step(0.0, ll.x) * step(ll.x, 1.0) * step(0.0, ll.y) * step(ll.y, 1.0);
          vec2 lc = clamp(ll, 0.0, 1.0);
          vec2 tx = 1.3 / uLinkSize;
          float a0 = texture2D(uLinkTex, lc).a * inb;
          float axp = texture2D(uLinkTex, lc + vec2(tx.x, 0.0)).a, axm = texture2D(uLinkTex, lc - vec2(tx.x, 0.0)).a;
          float ayp = texture2D(uLinkTex, lc + vec2(0.0, tx.y)).a, aym = texture2D(uLinkTex, lc - vec2(0.0, tx.y)).a;
          float soft = (a0 * 2.0 + axp + axm + ayp + aym) / 6.0 * inb;
          vec2 lg = vec2(axp - axm, ayp - aym) * inb;
          float gm = length(lg);
          vec2 across = normalize(mix(vec2(0.6, 0.8), lg / max(gm, 1e-3), smoothstep(0.05, 0.35, gm)));
          vec2 along = vec2(-across.y, across.x);
          float lv = dot(pk, along);
          float tv = fract(lv / (1.1 * uZoom));
          float ridge = sin(tv * 3.14159);
          float interior = 1.0 - smoothstep(0.05, 0.35, gm);
          float lrow = floor(lv / (1.1 * uZoom));
          float lph = fract((dot(pk, across) + lrow * 1.9 + hash(vec2(lrow, 11.0)) * 1.3) / (4.5 * uZoom));
          float lends = smoothstep(0.0, 0.14, lph) * smoothstep(1.0, 0.86, lph);
          ridge *= mix(1.0, mix(0.55, 1.0, lends), interior);

          // which icon, its local 0..1 coords (a square around each icon), how hovered it is
          float idx = ll.x < 0.5 ? 0.0 : 1.0;
          vec2 icc = vec2((idx + 0.5) * 0.5, 0.5);
          vec2 il = (ll - icc) * vec2(uLinkSize.x * 0.5, uLinkSize.y) / (uLinkSize.y * 0.72) + 0.5;
          float hv = (abs(idx - uLinkHover) < 0.5) ? uSweep : 0.0;    // progress, runs 0..1 in and 1..0 out
          float S = hv;
          float diag = (il.x + il.y) * 0.5;
          float front = mix(-0.35, 1.35, S);

          vec3 NL = normalize(N + vec3(-lg * 2.2 * (1.0 + 0.8 * hv), 0.0) + vec3(-along * cos(tv * 3.14159) * 0.6 * a0, 0.0));
          float ld = max(dot(NL, L), 0.0);
          vec3 Hl = normalize(L + vec3(0.0, 0.0, 1.0));
          float lsheen = pow(max(dot(NL, Hl), 0.0), 18.0) * 0.3;
          float band = exp(-pow(diag - front, 2.0) / 0.022) * hv;      // the shine
          vec3 white = vec3(0.90, 0.895, 0.88);
          vec3 dye = idx < 0.5 ? vec3(0.51, 0.31, 0.87)      // GitHub purple: #8250df
                               : vec3(0.04, 0.40, 0.76);     // LinkedIn: #0a66c2
          vec3 sheenCol = vec3(1.0);
          // each satin thread takes the colour at its own moment, roughly in stitch order
          float delay = hash(vec2(lrow, idx + 3.0)) * 0.5 + diag * 0.5;
          float colour = smoothstep(delay, delay + 0.08, S * 1.08);


          vec3 lthread = mix(white, dye, colour);
          vec3 linkC = lthread * (0.5 + 0.8 * ld) * (0.58 + 0.42 * ridge) + lsheen * ridge
                     + sheenCol * band * 0.7 * (0.4 + 0.6 * ridge);
          fab *= 1.0 - (0.3 + 0.2 * hv) * clamp(soft - a0 * 0.8, 0.0, 1.0);
          fab = mix(fab, linkC, smoothstep(0.3, 0.7, a0));
        }
      }

      // ---- the sticker, bent along the folds (only worked out near the sticker)
      float c = cos(uAngle), s = sin(uAngle);
      mat2 R = mat2(c, -s, s, c);
      vec3 col = fab;
      // a peeled flap reaches past the sticker's edges by at most the peel distance
      // (|corner - drag|), plus room for its shadow
      float reach = length(uSize) * 0.5 + length(uCorner - uDrag) + 60.0;
      float near = step(length(p - uCenter), reach);
      if (near > 0.5) {
        vec2 d = g * uScale * 2.5;
        vec2 q = p + d;
        vec2 Lp = toLocal(q, R);
        vec2 fn;
        float fs = foldSide(Lp, fn);
        vec4 st = texture2D(uTex, clamp(Lp / uSize, 0.0, 1.0));
        float sa = texA(Lp) * smoothstep(0.5, -0.5, fs);           // stuck-down part only
        vec3 srgb = st.a > 0.001 ? st.rgb / st.a : vec3(0.0);   // texture is premultiplied

        // sticker follows the folds but stays smooth: no knit texture showing through
        vec3 Ns = normalize(nF * vec3(0.85, 0.85, 1.0) + vec3(-sg * 0.12, 0.0)
                  + vec3(snoise(p * 0.05) * 0.03, snoise(p * 0.05 + 9.0) * 0.03, 0.0));
        float sd = max(dot(Ns, L), 0.0);
        vec3 sc = srgb * (0.55 + 0.55 * sd) * mix(0.90, 1.0, smoothstep(-1.1, 1.0, h));
        sc *= 1.0 - 0.008 * hash(floor(p * uDpr));      // barely-there paper grain
        vec3 H = normalize(L + vec3(0.0, 0.0, 1.0));
        float lum = dot(srgb, vec3(0.3, 0.59, 0.11));
        float gloss = pow(max(dot(Ns, H), 0.0), 48.0) * 0.20 + pow(max(dot(Ns, H), 0.0), 6.0) * 0.04;
        sc += gloss * smoothstep(0.12, 0.45, lum);         // marker ink stays matte

        // the flap: the sticker's white backing, folded over the fold line
        float flapA = 0.0;
        vec3 flapC = vec3(0.0);
        if (fs < 0.0) {
          flapA = texA(Lp - 2.0 * fs * fn) * smoothstep(0.0, 0.8, -fs + 0.3);
          float dist = -fs;
          float roll = 0.78 + 0.22 * smoothstep(0.0, 14.0, dist);   // darker in the tight curl
          float rim = exp(-pow(dist - 3.0, 2.0) / 5.0);             // light catching the curl
          vec3 backing = vec3(0.94, 0.935, 0.915);
          flapC = backing * (0.55 + 0.5 * max(dot(nF, L), 0.0)) * roll + 0.12 * rim;
          flapC *= 1.0 - 0.02 * hash(floor(p * uDpr) + 7.0);
          // lint stuck to the adhesive: mostly grey fleece fluff, some pale cat hair
          vec2 Lr = Lp - 2.0 * fs * fn;
          float lint = lintMask(Lr);
          float lshade = 0.55 + 0.5 * max(dot(nF, L), 0.0);
          vec3 lintC = mix(vec3(0.52, 0.52, 0.53), vec3(0.70, 0.70, 0.70), smoothstep(0.3, 0.8, snoise(Lr * 0.03 + 50.0) * 0.5 + 0.5)) * lshade;
          flapC = mix(flapC, lintC, lint * 0.4);
          // and a few long pale cat hairs pressed into the glue
          // "Hi" in blue ballpoint, laid out so it reads upright, next to the ghost, when the
          // top-right corner is peeled right back toward the left (fold running almost vertically)
          {
            float kk = uSize.x / 420.0;
            vec2 n0 = normalize(vec2(0.92, 0.40));
            vec2 eu = vec2(1.0, 0.0) - 2.0 * n0.x * n0;
            vec2 ev = vec2(0.0, 1.0) - 2.0 * n0.y * n0;
            vec2 bd = Lr - vec2(0.49, 0.41) * uSize;
            vec2 bs = vec2(dot(bd, eu), dot(bd, ev)) / kk / 1.1;
            if (dot(bs, bs) < 3600.0) {
              float ink = penBubble(bs) * (0.82 + 0.12 * snoise(bs * 0.25 + 5.0));
              vec3 inkC = vec3(0.12, 0.33, 0.82) * (0.72 + 0.32 * max(dot(nF, L), 0.0));
              flapC = mix(flapC, inkC, ink);
            }
          }
          float ch = catHairs(Lr);
          flapC = mix(flapC * (1.0 - 0.06 * ch), vec3(0.80, 0.79, 0.77) * (0.65 + 0.42 * max(dot(nF, L), 0.0)), ch * 0.7);   // pale, just a shade off the glue
        }

        // shadows: tight one from the stuck-down part, a wider softer one from the
        // flap (onto both the fabric and the sticker), and soft contact all round
        vec2 off = uLight * 3.5;
        vec2 offL = uLight * 14.0;
        float sh = 0.0, shL = 0.0;
        for (int i = -1; i <= 1; i++)
          for (int j = -1; j <= 1; j++) {
            vec2 o = vec2(float(i), float(j));
            sh += stickerA(q + off + o * 1.6, R).x;
            shL += stickerA(q + offL + o * 4.0, R).y;
          }
        sh /= 9.0; shL /= 9.0;
        float amb = 0.0;
        for (int i = 0; i < 8; i++) {
          float a = float(i) * 0.7854;
          amb += stickerA(q + vec2(cos(a), sin(a)) * 7.0, R).x;
        }
        amb /= 8.0;
        col = fab * (1.0 - 0.40 * sh - 0.45 * shL - 0.12 * amb);
        sc *= 1.0 - 0.40 * shL;
        col = mix(col, sc, sa);
        col = mix(col, flapC, flapA);
      }

      vec2 vq = (p * uDpr - uRes * 0.5) / uRes;
      col *= 1.0 - 0.22 * dot(vq, vq);
      gl_FragColor = vec4(col, 1.0);
    }`;

  function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(sh));
      return null;
    }
    return sh;
  }
  const vs = compile(gl.VERTEX_SHADER, VERT);

  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);

  // ---- Sticker texture: HTML-in-Canvas when available, else drawn with Canvas 2D ----
  const htmlInCanvas = typeof gl.texElementImage2D === 'function';
  let usingHTML = false;
  // The API has changed shape between Chrome versions: current builds take
  // (target, sizedInternalFormat, element); earlier ones took texImage2D-style arguments.
  function texFromElement(el) {
    try { gl.texElementImage2D(gl.TEXTURE_2D, gl.RGBA8 || 0x8058, el); }
    catch (err) { gl.texElementImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, el); }
  }

  function uploadFromElement() {
    try {
      gl.bindTexture(gl.TEXTURE_2D, tex);
      texFromElement(stickerEl);
      usingHTML = true;
      modeEl.textContent = 'HTML-in-Canvas (live DOM sticker → WebGL texture)';
      return true;
    } catch (err) {
      console.warn('texElementImage2D failed, using Canvas 2D sticker', err);
      return false;
    }
  }

  function drawStickerTo2D() {
    const S = 3;
    const c = document.createElement('canvas');
    c.width = STICKER_W * S; c.height = STICKER_H * S;
    const x = c.getContext('2d');
    x.scale(S, S);
    const rr = (X, Y, W, H, r) => { x.beginPath(); x.roundRect ? x.roundRect(X, Y, W, H, r) : x.rect(X, Y, W, H); };

    rr(0, 0, STICKER_W, STICKER_H, 22); x.fillStyle = '#d42a20'; x.fill();
    x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'top';
    if ('letterSpacing' in x) x.letterSpacing = '4px';
    x.font = '62px "Archivo Black", "Arial Black", sans-serif';
    x.fillText('HELLO', 210 + 2, 16);
    if ('letterSpacing' in x) x.letterSpacing = '0.5px';
    x.font = '700 21px Archivo, Arial, sans-serif';
    x.fillText('my name is', 210, 82);
    if ('letterSpacing' in x) x.letterSpacing = '0px';
    rr(14, 114, 392, 144, 4); x.fillStyle = '#fbfbf8'; x.fill();

    const ink = (text, px, cx, cy, deg, color) => {
      x.save();
      x.translate(cx, cy); x.rotate(deg * Math.PI / 180);
      x.font = px + 'px "Permanent Marker", cursive';
      x.textBaseline = 'middle';
      x.fillStyle = color;
      x.shadowColor = 'rgba(23,23,29,.45)'; x.shadowBlur = 1.4 * S;  // a little bleed into the paper
      x.fillText(text, 0, 0);
      x.shadowBlur = 0; x.globalAlpha = 0.18;                          // uneven pen pressure
      x.fillText(text, 0.5, 0.4);
      x.restore();
    };
    // the name is Orry's real handwriting, cut out of a photo of it
    x.save();
    x.translate(210, 178); x.rotate(-2 * Math.PI / 180);
    const sw = 340, sh = sw * signatureImg.naturalHeight / signatureImg.naturalWidth;
    x.shadowColor = 'rgba(23,23,29,.35)'; x.shadowBlur = 1.0 * S;   // a touch of bleed into the paper
    x.drawImage(signatureImg, -sw / 2, -sh / 2, sw, sh);
    x.restore();
    ink('here for the pizza · Philadelphia, PA', 17, 210, 236, -1.5, '#25252c');
    return c;
  }

  function uploadFrom2D() {
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, drawStickerTo2D());
    usingHTML = false;
    modeEl.innerHTML = 'Canvas 2D sticker. <b>HTML-in-Canvas</b> is off in this browser; ' +
      'in Chrome, turn on chrome://flags/#canvas-draw-element to texture the live HTML.';
  }

  function uploadSticker() {
    if (!(htmlInCanvas && uploadFromElement())) uploadFrom2D();
    uploadLinks();
    placeElements();
  }

  // Put the text layer's copies exactly where the shader draws the sticker and links, so
  // selection, find-in-page highlights, clicks and focus land on what you see.
  const elementM = { sticker: null, links: null };
  function placeElements() {
    if (!elementM.sticker) return;
    stickerText.style.transform = elementM.sticker.toString();
    linksText.style.transform = elementM.links.toString();
  }

  // ---- Links texture (unit 3): the live <nav> via HTML-in-Canvas, else the same layout in 2D
  const linkTex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE3);
  gl.bindTexture(gl.TEXTURE_2D, linkTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(4));
  gl.activeTexture(gl.TEXTURE0);
  gl.uniform1i(U.uLinkTex, 3);
  function drawLinksTo2D() {
    const S = 3, c = document.createElement('canvas');
    c.width = LINKS_W * S; c.height = LINKS_H * S;
    const x = c.getContext('2d');
    x.scale(S, S);
    x.fillStyle = '#fff';
    // the same icon paths the <svg>s in the nav use
    linkAnchors.forEach((a, i) => {
      x.save();
      x.translate(LINKS_W / 4 * (1 + 2 * i) - ICON / 2, LINKS_H / 2 - ICON / 2);
      x.scale(ICON / 24, ICON / 24);
      x.fill(new Path2D(a.querySelector('path').getAttribute('d')));
      x.restore();
    });
    return c;
  }
  function uploadLinks() {
    gl.activeTexture(gl.TEXTURE3);
    gl.bindTexture(gl.TEXTURE_2D, linkTex);
    let ok = false;
    if (htmlInCanvas) {
      try { texFromElement(linksEl); ok = true; }
      catch (err) { console.warn('texElementImage2D failed for links, using Canvas 2D', err); }
    }
    if (!ok) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, drawLinksTo2D());
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tex);
  }

  // ---- Layout + render ----
  const ANGLE = -0.06;
  const ZOOM = 1.6;            // close-up on the shirt: everything about the cloth is drawn 1.6x bigger
  const GHOST_FILL = 0.85;     // ghost height as a fraction of the sticker's
  let dpr = 1, layout = {};
  const light = { x: -0.45, y: -0.6 };

  // Peel state, in sticker-local px (origin top-left, y down)
  const peel = { corner: { x: 0, y: 0 }, drag: { x: 0, y: 0 }, goal: null, active: false, offset: { x: 0, y: 0 } };
  const corners = () => [
    { x: 0, y: 0 }, { x: layout.w, y: 0 }, { x: layout.w, y: layout.h }, { x: 0, y: layout.h },
  ];
  const towardCentre = c => {
    const dx = layout.w / 2 - c.x, dy = layout.h / 2 - c.y, l = Math.hypot(dx, dy);
    return { x: dx / l, y: dy / l };
  };
  const isRestCorner = c => c.x === layout.w && c.y === 0;   // top right
  function restFor(c) {
    if (!isRestCorner(c)) return { x: c.x, y: c.y };
    const t = towardCentre(c);
    return { x: c.x + t.x * 44, y: c.y + t.y * 44 };          // curled over on first load
  }
  function resetPeel() {
    const c = corners()[1];
    peel.corner = c; peel.drag = restFor(c); peel.goal = null; peel.active = false;
  }
  function toLocal(clientX, clientY) {
    const x = clientX - layout.cx, y = clientY - layout.cy;
    const c = Math.cos(ANGLE), s = Math.sin(ANGLE);
    return { x: c * x + s * y + layout.w / 2, y: -s * x + c * y + layout.h / 2 };
  }
  function hitCorner(Lp) {
    const R = 40;
    if (Math.hypot(Lp.x - peel.drag.x, Lp.y - peel.drag.y) < R) return peel.corner;   // the lifted flap's tip
    const lifted = Math.hypot(peel.drag.x - peel.corner.x, peel.drag.y - peel.corner.y) > 1;
    if (lifted) {   // one corner at a time: while it's up, only it can be grabbed
      return Math.hypot(Lp.x - peel.corner.x, Lp.y - peel.corner.y) < R ? peel.corner : null;
    }
    return corners().find(c => Math.hypot(Lp.x - c.x, Lp.y - c.y) < R) || null;
  }

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 1.75);
    canvas.width = Math.round(innerWidth * dpr);
    canvas.height = Math.round(innerHeight * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
    const w = Math.min(STICKER_W, innerWidth - 48);
    const h = w * STICKER_H / STICKER_W;
    layout = { cx: innerWidth / 2, cy: innerHeight * 0.43, w, h };
    resetPeel();
    const k = w / STICKER_W;
    layout.link = { cx: layout.cx, cy: Math.min(innerHeight - 26, layout.cy + h / 2 + 31 * k), w: LINKS_W * k, h: LINKS_H * k };   // same centre line as the ghost
    // Where the shader draws each element, in CSS px (the same maths as toLocal, forwards)
    elementM.sticker = new DOMMatrix()
      .translate(layout.cx, layout.cy).rotate(ANGLE * 180 / Math.PI).scale(k)
      .translate(-STICKER_W / 2, -STICKER_H / 2);
    elementM.links = new DOMMatrix()
      .translate(layout.link.cx, layout.link.cy).scale(k).translate(-LINKS_W / 2, -LINKS_H / 2);
    placeElements();
    schedule();
  }

  function draw() {
    gl.uniform2f(U.uRes, canvas.width, canvas.height);
    gl.uniform1f(U.uDpr, dpr);
    gl.uniform2f(U.uLight, light.x, light.y);
    gl.uniform2f(U.uCenter, layout.cx, layout.cy);
    gl.uniform2f(U.uSize, layout.w, layout.h);
    gl.uniform1f(U.uAngle, ANGLE);
    gl.uniform1f(U.uScale, 1400 * ZOOM);              // fixed, so folds keep their size and place
    gl.uniform1f(U.uZoom, ZOOM);
    gl.uniform2f(U.uAnchor, layout.cx, layout.cy);
    gl.uniform2f(U.uCorner, peel.corner.x, peel.corner.y);
    gl.uniform2f(U.uDrag, peel.drag.x, peel.drag.y);
    gl.uniform3f(U.uPoke, poke.x, poke.y, 0);
    // as big as it can be while the sticker still just covers it (its ink, loose stitch included,
    // spans ~99% of this box; it sits a touch high so the stitching's centre lines up with the sticker's)
    const g = ghostGeom();
    gl.uniform2f(U.uEmbCenter, g.cx, g.cy);
    gl.uniform2f(U.uEmbSize, g.w, g.h);
    const hp = hairPoints();
    gl.uniform4f(U.uHairA, hp[0], hp[1], hp[2], hp[3]);
    gl.uniform4f(U.uHairB, hp[4], hp[5], hp[6], hp[7]);
    gl.uniform1f(U.uEmbAngle, 0.0);                  // upright, so it lines up with the icons
    gl.uniform2f(U.uLinkCenter, layout.link.cx, layout.link.cy);
    gl.uniform2f(U.uLinkSize, layout.link.w, layout.link.h);
    gl.uniform1f(U.uLinkHover, hover.idx);
    gl.uniform1f(U.uSweep, hover.p);
    gl.uniform3f(U.uPucker, 0, 0, 0);
    gl.uniform2f(U.uPokeV, poke.dx, poke.dy);
    // seam sits a comfortable gap to the right of the sticker; curves outward above ~40% height
    const seamX = Math.min(innerWidth - 28, layout.cx + layout.w / 2 + Math.max(110, innerWidth * 0.18));
    const seamY0 = innerHeight * 0.4;
    gl.uniform3f(U.uSeam, seamX, seamY0, 70 / (seamY0 * seamY0));
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  // ---- the ghost and its hair
  function ghostGeom() {
    const eh = layout.h * GHOST_FILL;
    return { cx: layout.link.cx, cy: layout.cy - eh * 0.015, w: eh * 430 / 400, h: eh };
  }
  // the hair's spring: (x, y) is how far its tip has been knocked, (vx, vy) its velocity
  const hair = { x: 0, y: 0, vx: 0, vy: 0 };
  const HAIR_ROOT = [0.57, 0.085];                 // just inside the head's stitching, so it grows out of it                  // top of the head, in the ghost image's 0..1 coords
  function hairPoints() {
    const g = ghostGeom(), e = g.h;
    const A = [g.cx + (HAIR_ROOT[0] - 0.5) * g.w, g.cy + (HAIR_ROOT[1] - 0.5) * g.h];
    // rest shape: a limp loose thread. It lifts a little out of the stitching, flops over to
    // the right and lies back down across the head, its end resting on the cloth
    const P1 = [A[0] + 0.012 * e, A[1] - 0.075 * e];
    const P2 = [A[0] + 0.085 * e + hair.x * 0.6, A[1] - 0.09 * e + hair.y * 0.6];
    const P3 = [A[0] + 0.15 * e + hair.x, A[1] - 0.02 * e + hair.y * 0.8];
    return [...A, ...P1, ...P2, ...P3];
  }
  function stepHair() {
    if (reduceMotion) { hair.x = hair.y = hair.vx = hair.vy = 0; return false; }
    hair.vx = (hair.vx - hair.x * 0.025) * 0.8;    // limp: it drifts slowly back and settles, no bounce
    hair.vy = (hair.vy - hair.y * 0.025) * 0.8;
    hair.x += hair.vx; hair.y += hair.vy;
    if (Math.abs(hair.x) + Math.abs(hair.y) + Math.abs(hair.vx) + Math.abs(hair.vy) < 0.02) { hair.x = hair.y = hair.vx = hair.vy = 0; return false; }
    return true;
  }
  function nearHair(x, y, R) {
    const p = hairPoints();
    const mid = [(p[2] + p[4]) / 2, (p[3] + p[5]) / 2];
    return Math.hypot(x - p[6], y - p[7]) < R || Math.hypot(x - mid[0], y - mid[1]) < R;
  }
  let hairLast = null;
  addEventListener('pointermove', e => {
    if (peel.active) { hairLast = null; return; }
    const p = { x: e.clientX, y: e.clientY };
    if (hairLast && nearHair(p.x, p.y, 22)) {      // brushing past knocks it the way you moved
      const dx = p.x - hairLast.x, dy = p.y - hairLast.y, m = Math.hypot(dx, dy);
      const s = Math.min(m, 8) / Math.max(m, 1e-3);   // cap how hard a fast flick can hit it
      hair.vx += dx * s * 0.35; hair.vy += dy * s * 0.35;
      schedule();
    }
    hairLast = p;
  });
  addEventListener('click', e => {
    if (e.target.closest?.('a') || !nearHair(e.clientX, e.clientY, 18)) return;
    hair.vx += (Math.random() - 0.5) * 3; hair.vy -= 2 + Math.random();     // a little flick
    schedule();
  });

  let raf = 0;
  function schedule() { if (!raf) raf = requestAnimationFrame(frame); }
  // Cloth reacting to the cursor. The pointer's motion pulls on a damped spring (dx, dy);
  // the shader drags the folds near the cursor by that amount, so the fabric eases
  // along behind the pointer and settles back with a slight sway.
  const poke = { x: -9999, y: -9999, tx: -9999, ty: -9999, pull: { x: 0, y: 0 }, dx: 0, dy: 0, vx: 0, vy: 0 };
  if (!reduceMotion) {
    addEventListener('pointermove', e => {
      if (poke.tx < -9000) { poke.x = poke.tx = e.clientX; poke.y = poke.ty = e.clientY; }
      poke.pull.x += (e.clientX - poke.tx) / 120;
      poke.pull.y += (e.clientY - poke.ty) / 120;
      const l = Math.hypot(poke.pull.x, poke.pull.y);
      if (l > 1) { poke.pull.x /= l; poke.pull.y /= l; }
      poke.tx = e.clientX; poke.ty = e.clientY;
      schedule();
    }, { passive: true });
  }
  function stepPoke() {
    poke.x += (poke.tx - poke.x) * 0.06;
    poke.y += (poke.ty - poke.y) * 0.06;
    poke.pull.x *= 0.92; poke.pull.y *= 0.92;            // the pull fades once the pointer rests
    // ease toward the pull with no overshoot, so the cloth never wobbles
    poke.vx = (poke.pull.x - poke.dx) * 0.07;
    poke.vy = (poke.pull.y - poke.dy) * 0.07;
    poke.dx += poke.vx; poke.dy += poke.vy;
    return Math.abs(poke.dx) + Math.abs(poke.dy) + Math.abs(poke.vx) + Math.abs(poke.vy)
         + Math.abs(poke.pull.x) + Math.abs(poke.pull.y) > 0.0005;
  }

  function frame() {
    raf = 0;
    if (stepPoke()) schedule();
    if (stepHover()) schedule();
    if (stepHair()) schedule();
    if (peel.goal && !peel.active) {
      // pressed flat: the corner smooths down onto the fabric
      const k = reduceMotion ? 1 : 0.18;
      peel.drag.x += (peel.goal.x - peel.drag.x) * k;
      peel.drag.y += (peel.goal.y - peel.drag.y) * k;
      if (Math.hypot(peel.goal.x - peel.drag.x, peel.goal.y - peel.drag.y) < 0.3) {
        peel.drag = { ...peel.goal };
        peel.goal = null;
      }
      if (peel.goal) schedule();
    }
    draw();
  }

  addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    const Lp = toLocal(e.clientX, e.clientY);
    const c = hitCorner(Lp);
    if (!c) return;
    if (c !== peel.corner) { peel.corner = c; peel.drag = { ...c }; }
    peel.active = true; peel.goal = null;
    peel.offset = { x: peel.drag.x - Lp.x, y: peel.drag.y - Lp.y };
    peel.downAt = { x: e.clientX, y: e.clientY }; peel.moved = 0;
    canvas.setPointerCapture(e.pointerId);
    setCursor('grabbing');
    e.preventDefault();
  });
  addEventListener('pointermove', e => {
    const Lp = toLocal(e.clientX, e.clientY);
    if (!peel.active) { if (e.buttons === 0) setCursor(hitCorner(Lp) ? 'grab' : ''); return; }
    peel.moved = Math.max(peel.moved, Math.hypot(e.clientX - peel.downAt.x, e.clientY - peel.downAt.y));
    const c = peel.corner, t = towardCentre(c);
    let dx = Lp.x + peel.offset.x - c.x, dy = Lp.y + peel.offset.y - c.y;
    // Keep the pull inside a cone pointing into the sticker. Sideways pull is limited
    // by how far in you've pulled, so going back past the start point eases the
    // corner flat; it can't swing the fold line across the sticker and flip it over.
    const along = dx * t.x + dy * t.y;
    if (along <= 0) { dx = 0; dy = 0; }
    else {
      let side = -dx * t.y + dy * t.x;
      const maxSide = along * 1.7;                  // ~60° either side of the diagonal
      side = Math.max(-maxSide, Math.min(maxSide, side));
      dx = t.x * along - t.y * side;
      dy = t.y * along + t.x * side;
    }
    const maxL = 0.8 * Math.hypot(layout.w, layout.h), l = Math.hypot(dx, dy);
    if (l > maxL) { dx *= maxL / l; dy *= maxL / l; }
    peel.drag = { x: c.x + dx, y: c.y + dy };
    schedule();
  });
  const letGo = () => {
    if (!peel.active) return;
    peel.active = false;
    // it stays where you leave it; a tap, or pushing it nearly flat, smooths it down
    const lift = Math.hypot(peel.drag.x - peel.corner.x, peel.drag.y - peel.corner.y);
    if (peel.moved < 4 || lift < 18) peel.goal = { ...peel.corner };
    setCursor('');
    schedule();
  };
  // the sticker is real text, so a corner drag must not also start a text selection
  addEventListener('selectstart', e => { if (peel.active) e.preventDefault(); });
  canvas.addEventListener('pointerup', letGo);
  canvas.addEventListener('pointercancel', letGo);

  // The stitched links: hover and focus colour the thread. The text layer's real <a>s sit over
  // the stitching, so clicks and keyboard focus go to them directly.
  let linkHover = -1;
  function linkAt(x, y) {
    const L = layout.link;
    const u = (x - L.cx) / L.w + 0.5, v = (y - L.cy) / L.h + 0.5;
    return (u >= 0 && u <= 1 && v >= 0 && v <= 1) ? Math.min(1, Math.floor(u * 2)) : -1;
  }
  // ---- hover: a sheen sweeps across the icon and its threads change to the brand colour one by
  // one. p runs 0 -> 1 at a steady pace while hovered and back 1 -> 0 after, so it plays in reverse.
  const hover = { idx: -1, p: 0, last: 0, px: 0, py: 0 };
  const SWEEP_MS = 800;
  const setHover = i => {
    if (i === linkHover) return;
    linkHover = i;
    if (i >= 0 && hover.idx !== i) { hover.idx = i; hover.p = 0; }
    hover.last = performance.now();
    schedule();
  };
  function stepHover() {
    const now = performance.now(), dt = Math.min(64, now - (hover.last || now));
    hover.last = now;
    const target = linkHover >= 0 ? 1 : 0;
    const step = reduceMotion ? 1 : dt / SWEEP_MS;
    hover.p = target ? Math.min(1, hover.p + step) : Math.max(0, hover.p - step);
    if (hover.p === 0 && !target) hover.idx = -1;
    return hover.p !== target;
  }
  addEventListener('pointermove', e => {
    if (peel.active) return;
    const i = linkAt(e.clientX, e.clientY);
    hover.px = e.clientX; hover.py = e.clientY;
    if (document.activeElement && linkTargets.includes(document.activeElement)) return;
    setHover(i);
  });
  document.documentElement.addEventListener('pointerleave', () => setHover(-1));
  linkTargets.forEach((a, i) => {
    a.addEventListener('focus', () => setHover(i));
    a.addEventListener('blur', () => setHover(-1));
  });

  addEventListener('resize', resize);

  // HTML-in-Canvas: re-texture whenever the sticker's or the links' rendering changes
  canvas.addEventListener('paint', () => { if (htmlInCanvas) { uploadSticker(); schedule(); } });

  const fontsReady = Promise.race([
    Promise.all([
      document.fonts.load('62px "Archivo Black"'),
      document.fonts.load('700 21px Archivo'),
      document.fonts.load('700 16px Archivo'),
      document.fonts.load('17px "Permanent Marker"'),
      signatureImg.decode(),
    ]),
    new Promise(r => setTimeout(r, 2500)),
  ]).catch(() => {});

  resize();
  fontsReady.then(() => {
    uploadSticker();
    if (htmlInCanvas && canvas.requestPaint) canvas.requestPaint();
    schedule();
  });
})();
</script>
<script>
// ---- Cat hairs: drawn on a 2D canvas over the shirt. Click a hair to pick it off,
// or click-drag to wipe a few away. They're pinned to the shirt (measured from the
// sticker's centre), never on the sticker, and ordinary mouse movement leaves them be.
(() => {
  const cv = document.getElementById('hairs');
  const ctx = cv.getContext('2d');
  let rnd = 20261118;                                   // seeded: same shirt every visit
  const rand = () => ((rnd = (rnd * 1664525 + 1013904223) >>> 0) / 4294967296);
  const range = (a, b) => a + rand() * (b - a);
  // mostly pale, see-through undercoat with a few darker guard hairs
  const COLORS = [['#fbfaf7', 0.55], ['#eceae5', 0.25], ['#d3cfc9', 0.12], ['#5e5955', 0.08]];
  const pick = () => { let r = rand(); for (const [c, w] of COLORS) { if ((r -= w) <= 0) return c; } return COLORS[0][0]; };

  const SA = -0.06, cs = Math.cos(SA), sn = Math.sin(SA);
  const onSticker = (x, y) => {                         // 420x300 sticker, rotated, plus a margin
    const lx = cs * x + sn * y, ly = -sn * x + cs * y;
    if (Math.abs(lx) < 222 && Math.abs(ly) < 162) return true;
    return Math.abs(x) < 78 && y > 148 && y < 218; // the stitched icons under it
  };

  // one hair = a wandering polyline: heading drifts and occasionally kinks, like real fur
  function growHair(x, y, len) {
    const pts = [[x, y]];
    let a = rand() * Math.PI * 2, curl = range(-0.035, 0.035);
    const step = 2.5, n = Math.max(3, Math.round(len / step));
    for (let i = 0; i < n; i++) {
      curl = Math.max(-0.05, Math.min(0.05, curl + range(-0.01, 0.01)));   // gentle arcs, not curls
      if (rand() < 0.02) a += range(-0.6, 0.6);         // the odd kink
      a += curl;
      x += Math.cos(a) * step; y += Math.sin(a) * step;
      pts.push([x, y]);
    }
    return pts;
  }

  const hairs = [];
  function makeHairs() {
    const add = (cx, cy, len, opts = {}) => {
      const pts = growHair(cx, cy, len);
      if (pts.some(([x, y]) => onSticker(x, y))) return false;
      hairs.push({
        pts, dx: 0, dy: 0, vx: 0, vy: 0, rot: 0, va: 0,
        w: (opts.w ?? range(0.6, 1.0)) * 1.25,
        col: pick(), alpha: opts.alpha ?? range(0.13, 0.22),
        loose: false, fade: 1,
      });
      return true;
    };
    const spot = () => [range(-760, 760), range(-470, 470)];
    let tries = 0;
    // long, wavy hairs
    for (let n = 0; n < 30 && tries < 3000; tries++) { const [x, y] = spot(); if (add(x, y, range(55, 150))) n++; }
    // short wisps and fluff
    for (let n = 0; n < 60 && tries < 6000; tries++) { const [x, y] = spot(); if (add(x, y, range(12, 38), { w: range(0.5, 0.8), alpha: range(0.08, 0.17) })) n++; }
    // a few little tangles, the way hair collects in the knit
    for (let k = 0, made = 0; made < 6 && k < 200; k++) {
      const [x, y] = spot();
      if (onSticker(x, y)) continue;
      made++;
      const m = 3 + Math.floor(rand() * 4);
      for (let j = 0; j < m; j++) add(x + range(-12, 12), y + range(-12, 12), range(15, 60), { w: range(0.35, 0.65) });
    }
  }

  let W = 0, H = 0, dpr = 1;
  const scale = () => Math.min(420, W - 48) / 420;      // same as the sticker's layout
  const origin = () => ({ x: W / 2, y: H * 0.43 });
  function screenPts(h) {
    const k = scale(), o = origin();
    const [x0, y0] = h.pts[0];
    const c = Math.cos(h.rot), s = Math.sin(h.rot);
    return h.pts.map(([x, y]) => {
      const rx = x - x0, ry = y - y0;
      return [o.x + (x0 + c * rx - s * ry) * k + h.dx, o.y + (y0 + s * rx + c * ry) * k + h.dy];
    });
  }
  function strokeHair(P, w, col, alpha, ox, oy) {
    ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const n = P.length - 1;
    for (let i = 0; i < n; i++) {
      const t = i / n;
      ctx.globalAlpha = alpha * (t < 0.15 ? 0.6 + t * 2.6 : 1) * (t > 0.7 ? 1 - (t - 0.7) * 2.2 : 1);  // fine at both ends
      ctx.lineWidth = w * (1 - t * 0.55);
      ctx.beginPath(); ctx.moveTo(P[i][0] + ox, P[i][1] + oy); ctx.lineTo(P[i + 1][0] + ox, P[i + 1][1] + oy); ctx.stroke();
    }
  }
  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    for (const h of hairs) {
      const P = screenPts(h);
      const lift = h.loose ? 1.5 : 0;
      strokeHair(P, h.w + 0.6, '#141418', 0.08 * h.fade, 0.6 + lift, 0.8 + lift);   // barely-there shadow
      strokeHair(P, h.w, h.col, h.alpha * h.fade, 0, 0);
    }
    ctx.globalAlpha = 1;
  }
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    draw();
  }

  // ---- removing them
  let raf = 0;
  const tick = () => {
    raf = 0;
    let moving = false;
    for (let i = hairs.length - 1; i >= 0; i--) {
      const h = hairs[i];
      if (!h.loose) continue;
      h.dx += h.vx; h.dy += h.vy; h.rot += h.va;
      h.vx *= 0.93; h.vy *= 0.93; h.va *= 0.9;
      h.fade -= 0.014 + Math.hypot(h.vx, h.vy) * 0.002;
      if (h.fade <= 0) { hairs.splice(i, 1); continue; }
      moving = true;
    }
    draw();
    if (moving) raf = requestAnimationFrame(tick);
  };
  const kick = () => { if (!raf) raf = requestAnimationFrame(tick); };

  const distToHair = (P, x, y) => {
    let bd = 1e9;
    for (let i = 0; i < P.length - 1; i++) {
      const [ax, ay] = P[i], [bx, by] = P[i + 1];
      const vx = bx - ax, vy = by - ay, l2 = vx * vx + vy * vy || 1;
      const t = Math.max(0, Math.min(1, ((x - ax) * vx + (y - ay) * vy) / l2));
      bd = Math.min(bd, Math.hypot(x - ax - vx * t, y - ay - vy * t));
    }
    return bd;
  };
  function hairAt(x, y, R = 8) {
    let best = null, bd = R;
    for (const h of hairs) {
      if (h.loose) continue;
      const d = distToHair(screenPts(h), x, y);
      if (d < bd) { bd = d; best = h; }
    }
    return best;
  }
  function pluck(h, vx = 0, vy = 0) {
    h.loose = true;
    const ang = rand() * Math.PI * 2;
    h.vx = vx * 0.6 + Math.cos(ang) * 1.1; h.vy = vy * 0.6 + Math.sin(ang) * 1.1 - 0.7;
    h.va = range(-0.06, 0.06);
    kick();
  }

  let downAt = null, last = null;
  addEventListener('pointerdown', e => {
    last = { x: e.clientX, y: e.clientY };
    downAt = e.defaultPrevented ? null : last;          // a sticker peel is never a hair click
  });
  addEventListener('pointermove', e => {
    const p = { x: e.clientX, y: e.clientY };
    if (downAt && e.buttons !== 0 && last) {            // click-drag wipes what it passes over
      const vx = p.x - last.x, vy = p.y - last.y, steps = Math.max(1, Math.ceil(Math.hypot(vx, vy) / 6));
      for (let i = 1; i <= steps; i++) {
        const x = last.x + vx * i / steps, y = last.y + vy * i / steps;
        for (const h of hairs) if (!h.loose && distToHair(screenPts(h), x, y) < 18) pluck(h, vx, vy);
      }
    }
    last = p;
    if (e.buttons === 0) document.body.style.cursor = hairAt(p.x, p.y) ? 'pointer' : '';
  }, { passive: true });
  addEventListener('click', e => {
    if (!downAt || Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 5) return;
    const h = hairAt(e.clientX, e.clientY);
    if (h) { pluck(h); document.body.style.cursor = ''; }
  });
  const up = () => { downAt = null; };
  addEventListener('pointerup', () => setTimeout(up, 0));   // after the click handler runs
  addEventListener('pointercancel', up);
  addEventListener('resize', resize);

  makeHairs();
  resize();
})();
</script>
